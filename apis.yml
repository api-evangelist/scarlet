name: Scarlet
description: 'Scarlet is Europe''s only Notified Body specialised in software and AI-based
  medical devices. Operating at scarlet.cc, Scarlet certifies Software as a Medical
  Device (SaMD) and AI as a Medical Device (AIaMD) under the EU Medical Device Regulation
  (MDR), streamlining conformity assessment, CE marking, and certificate transfers
  for manufacturers who ship iteratively and release frequently. Backed by Creandum,
  Scarlet was built to bring modern, fast-moving regulatory certification to AI and
  software medical-technology companies. Scarlet is a regulatory and certification
  services provider; it currently publishes no public developer API surface.'
